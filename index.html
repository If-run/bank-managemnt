<html lang="en">

<title>Bank & OD Control</title>
<meta name="description" content="Monthly bank statement import, OD control and cash-flow forecast">

<style>

*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--nav);color:#fff;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}.brand small{display:block;opacity:.7;font-size:11px}
.logo{width:34px;height:34px;border-radius:8px;background:#1f6fd1;display:grid;place-items:center;font-weight:800;font-size:13px}
.top select{padding:5px 8px;border-radius:6px;border:0;max-width:260px;background:#fff;color:#17202b}
.top label{font-size:12px}

nav a{padding:11px 11px;color:var(--mut);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
nav a.on{color:var(--pri);border-color:var(--pri)}

h1{font-size:20px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 10px}

.b-red{background:var(--badb);color:var(--bad)}.b-grey{background:var(--line);color:var(--mut)}

<body>
<header class="top">
  <div class="brand"><span class="logo">OD</span><div><b id="orgName">Bank &amp; OD Control</b><small>Monthly bank statements → management information</small></div></div>
  <div class="topr"><label>Account&nbsp; <select id="accSel" data-chg="accSel"></select></label></div>
</header>
<nav id="nav"></nav>
<main id="main"><p class="muted">Loading…</p></main>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   BANK & OD CONTROL — single-file app (v1.0)
   Layers (top → bottom of this file):
     1 CONFIG      categories, default rules, plan types, settings
     2 UTIL        dates, amounts, formatting
     3 IMPORT      file reading (PDF/CSV/Excel), header detection, column
                   mapping, extraction, validation, duplicate keys
     4 CLASSIFY    keyword rules (user rules first, then built-in)
     5 STORAGE     IndexedDB behind an async interface (swappable later
                   for Firebase/Supabase without touching the UI)
     6 STATE       in-memory state + derived running balances
     7 ANALYTICS   period stats, comparisons, insights, patterns
     8 FORECAST    projection, OD breach analysis, action center
     9 UI          pages, events
   Data kinds are kept separate everywhere:
     ACTUAL   = imported, confirmed bank transactions
     EXPECTED = committed but not yet in the bank (customer collections,
                cheques received/issued)
     PLANNED  = management plans (scheduled payments/expenses)
     FORECAST = calculated by the system
   ===================================================================== */

/* ---------- 1. CONFIG ---------- */
// Spec note: "Bank Charges" was listed under both EXPENSE and OTHER — kept once (EXPENSE).
// OD Interest moved to EXPENSE: it is a real cost of the business.
// "Returned Cheque" added under INCOME so a bounced customer cheque reverses the income it created.
const CATS=[
 ['Customer Collection','INCOME'],['Sales Collection','INCOME'],['Incoming Cheque','INCOME'],['Bank Transfer In','INCOME'],['Other Income','INCOME'],['Returned Cheque','INCOME'],
 ['Supplier Payment','PAYMENT'],['Purchase Payment','PAYMENT'],['Outgoing Cheque','PAYMENT'],['Bank Transfer Out','PAYMENT'],
 ['Salary','EXPENSE'],['Electricity','EXPENSE'],['Fuel','EXPENSE'],['Transport','EXPENSE'],['Rent','EXPENSE'],['Maintenance','EXPENSE'],['Marketing','EXPENSE'],['Bank Charges','EXPENSE'],['OD Interest','EXPENSE'],['Other Expenses','EXPENSE'],
 ['Internal Transfer','OTHER'],['Loan','OTHER'],['Needs Review','OTHER']];
const GROUP=Object.fromEntries(CATS);
const GROUP_LABEL={INCOME:'Income',PAYMENT:'Purchases / payments',EXPENSE:'Expenses',OTHER:'Other (loans, own transfers, unreviewed)'};

const PLAN_KINDS={
 COLLECTION:{label:'Expected customer collection',sign:1,type:'EXPECTED',flex:false},
 CHQ_IN:{label:'Expected incoming cheque',sign:1,type:'EXPECTED',flex:false},
 CHQ_OUT:{label:'Issued outgoing cheque',sign:-1,type:'EXPECTED',flex:false},
 SUPPLIER:{label:'Scheduled supplier / purchase payment',sign:-1,type:'PLANNED',flex:true},
 EXPENSE:{label:'Scheduled expense',sign:-1,type:'PLANNED',flex:false},
 INFLOW:{label:'Planned other inflow (loan, capital)',sign:1,type:'PLANNED',flex:false}};

// Built-in keyword rules, checked in this order AFTER the user's own rules.
// d: in = money in only, out = money out only, any = both.
const DEFAULT_RULES=[
 {w:'RETURN,RETURNED,RTN,UNPAID,DISHONOURED,DISHONORED,REFER TO DRAWER',d:'out',c:'Returned Cheque'},
 {w:'RETURN,RETURNED,RTN,UNPAID,DISHONOURED,DISHONORED,REFER TO DRAWER',d:'in',c:'Outgoing Cheque'},
 {w:'OWN ACCOUNT,OWN A/C,INTERNAL TRANSFER,INTER ACCOUNT,SWEEP',d:'any',c:'Internal Transfer'},
 {w:'LOAN,TERM LOAN,LEASE',d:'any',c:'Loan'},
 {w:'SALARY,SALARIES,PAYROLL,EPF,ETF,WAGES',d:'out',c:'Salary'},
 {w:'CEB,LECO,ELECTRICITY',d:'out',c:'Electricity'},
 {w:'FUEL,CEYPETCO,LIOC,FILLING,PETROL,DIESEL',d:'out',c:'Fuel'},
 {w:'RENT',d:'out',c:'Rent'},
 {w:'OD INTEREST,OD INT,DEBIT INTEREST,INTEREST',d:'out',c:'OD Interest'},
 {w:'CHARGE,CHARGES,COMMISSION,FEE,FEES,STAMP DUTY,SMS ALERT,DEBIT TAX',d:'out',c:'Bank Charges'},
 {w:'REPAIR,REPAIRS,MAINTENANCE',d:'out',c:'Maintenance'},
 {w:'ADVERT,ADVERTISING,MARKETING,PROMOTION',d:'out',c:'Marketing'},
 {w:'TRANSPORT,LORRY,FREIGHT,COURIER,HIRE',d:'out',c:'Transport'},
 {w:'INTEREST',d:'in',c:'Other Income'},
 {w:'CASH DEP,CASH DEPOSIT,CDM',d:'in',c:'Sales Collection'},
 {w:'CHQ,CHEQUE,CLEARING,CLG,CHK',d:'in',c:'Incoming Cheque'},
 {w:'CHQ,CHEQUE,CLEARING,CLG,CHK',d:'out',c:'Outgoing Cheque'},
 {w:'CEFT,SLIPS,TRANSFER,TRF,FUND TRANSFER,LANKAPAY,RTGS,IBT',d:'in',c:'Bank Transfer In'},
 {w:'CEFT,SLIPS,TRANSFER,TRF,FUND TRANSFER,LANKAPAY,RTGS,IBT',d:'out',c:'Bank Transfer Out'}];

const DEFAULT_SETTINGS={id:'main',org:'',fyStart:4,dateOrder:'AUTO',highlight:15,horizon:60,baseline:false,mappings:{}};
const RET_RX=/\b(RETURN|RETURNED|RTN|UNPAID|DISHONOU?RED|REFER TO DRAWER)\b/i;
const COLORS={pri:'#1f6fd1',ok:'#16a34a',bad:'#dc2626',warn:'#d97706',pur:'#7c3aed',grey:'#94a3b8',teal:'#0d9488',pink:'#db2777'};
const PALETTE=['#1f6fd1','#16a34a','#d97706','#7c3aed','#dc2626','#0d9488','#db2777','#64748b','#ca8a04','#2563eb','#9333ea','#059669'];

/* ---------- 2. UTIL ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const round2=n=>Math.round((+n||0)*100)/100;
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const pad=n=>String(n).padStart(2,'0');
const digits=s=>String(s??'').replace(/\D/g,'');
function fmt(n,dec=0){if(n==null||isNaN(n))return '–';const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});return (n<0?'-':'')+s;}
const rs=n=>n==null||isNaN(n)?'–':'Rs.\u00a0'+fmt(n);
const pct=x=>x==null||!isFinite(x)?'–':(x*100).toFixed(Math.abs(x)<0.1?1:0)+'%';
function short(n){const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e3?(a/1e3).toFixed(0)+'K':a.toFixed(0);return (n<0?'-':'')+s;}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=toD(s);d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d);};
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const monthKey=s=>s.slice(0,7);
const monthLabel=k=>MON[+k.slice(5,7)-1]+' '+k.slice(0,4);
const monthEnd=k=>{const[y,m]=k.slice(0,7).split('-').map(Number);return iso(new Date(y,m,0));};
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'–';
const dm=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const todayIso=()=>iso(new Date());
function mkDate(y,m,d){if(y<100)y+=2000;if(!(m>=1&&m<=12&&d>=1&&d<=31))return null;if(y<1990||y>2100)return null;const dt=new Date(y,m-1,d);return dt.getMonth()===m-1?iso(dt):null;}

/** Parses the many date styles banks use. order = 'DMY' (Sri Lanka default) or 'MDY'. */
function parseDate(v,order='DMY'){
 if(v==null||v==='')return null;
 if(typeof v==='number'){
  if(v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return mkDate(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}
  const s=String(v);if(/^\d{8}$/.test(s))return mkDate(+s.slice(0,4),+s.slice(4,6),+s.slice(6));return null;}
 if(v instanceof Date)return isNaN(v)?null:iso(v);
 let s=String(v).trim().toUpperCase();if(!s||s.length>24)return null;
 s=s.replace(/[T\s]+\d{1,2}:\d{2}(:\d{2})?(\.\d+)?(\s*[AP]M)?Z?$/,'').trim();
 let m;
 if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/)))return mkDate(+m[1],+m[2],+m[3]);
 if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/)))return order==='MDY'?mkDate(+m[3],+m[1],+m[2]):mkDate(+m[3],+m[2],+m[1]);
 if((m=s.match(/^(\d{1,2})[-\/.\s]?([A-Z]{3})[A-Z]*[-\/.\s,]*(\d{2}|\d{4})$/)))return MONTHS[m[2]]?mkDate(+m[3],MONTHS[m[2]],+m[1]):null;
 if((m=s.match(/^([A-Z]{3})[A-Z]*[\s\-.]+(\d{1,2}),?[\s\-.]+(\d{2}|\d{4})$/)))return MONTHS[m[1]]?mkDate(+m[3],MONTHS[m[1]],+m[2]):null;
 if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return mkDate(+m[1],+m[2],+m[3]);
 return null;
}
/** Looks at a whole date column to decide day-first vs month-first. */
function detectOrder(vals,fallback){
 let dmyHits=0,mdyHits=0;
 for(const v of vals){if(typeof v!=='string')continue;const m=v.trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{2,4}/);if(!m)continue;if(+m[1]>12)dmyHits++;if(+m[2]>12)mdyHits++;}
 if(dmyHits&&!mdyHits)return 'DMY';if(mdyHits&&!dmyHits)return 'MDY';
 return fallback&&fallback!=='AUTO'?fallback:'DMY';
}
/** Returns a signed number or null. "1,250.00 DR", "(1,250.00)" and "-1250" are negative. */
function parseAmount(v){
 if(v==null||v==='')return null;
 if(typeof v==='number')return isFinite(v)?v:null;
 let s=String(v).toUpperCase().trim();if(!s||/^[-–—.]+$/.test(s))return null;
 if(s.length>30)return null;
 let neg=false;
 if(/^\(.*\)$/.test(s.replace(/\s*(CR|DR)$/,'')))neg=true;
 if(/(^|[\s\d.])DR\.?$/.test(s)||/^DR\b/.test(s))neg=true;
 const core=s.replace(/^(RS\.?|LKR)\s*/,'');
 if(/^-/.test(core)||/\d-\s*$/.test(core))neg=true;
 s=core.replace(/RS\.?|LKR|CR\.?|DR\.?|[(),\s]/g,'').replace(/[-–]/g,'');
 if(!/^\d*\.?\d+$/.test(s))return null;
 const n=parseFloat(s);return neg?-n:n;
}
const isAmountText=c=>typeof c==='number'?true:(parseAmount(c)!==null&&/[.,]/.test(String(c)));

/* ---------- 3. IMPORT ENGINE ---------- */
const FIELDS=[['','— ignore —'],['date','Date'],['desc','Description'],['dr','Debit (money out)'],['cr','Credit (money in)'],['amt','Amount (+ in / − out)'],['drcr','DR/CR flag'],['bal','Balance'],['chq','Cheque no.'],['ref','Reference']];
// Order matters: a header cell is given to the first field that matches.
const HDR=[
 ['drcr',['dr/cr','cr/dr','d/c','dr cr','cr dr','debit/credit','credit/debit','dr or cr']],
 ['date',['transaction date','txn date','tran date','trans date','posting date','post date','value date','date']],
 ['bal',['running balance','balance']],
 ['chq',['cheque','chq','instrument','check no']],
 ['ref',['reference','ref no','ref','transaction id','tran id','txn id','doc no','journal no']],
 ['dr',['debit','debits','withdrawal','withdrawals','dr','paid out','payments','money out']],
 ['cr',['credit','credits','deposit','deposits','cr','paid in','receipts','money in']],
 ['amt',['amount','transaction amount','txn amount']],
 ['desc',['description','particulars','narration','narrative','details','remarks','transaction','memo']]];
const normH=s=>String(s??'').toLowerCase().replace(/[^a-z\/ ]+/g,' ').replace(/\s+/g,' ').trim();
function kwMatch(h,k){if(!h)return false;if(k.length<=3)return h===k||(h.length<=14&&h.split(/[ \/]/).includes(k));return h.includes(k);}
const headerSig=row=>(row||[]).map(normH).join('|');

function detectHeader(rows){
 let best=null;const lim=Math.min(rows.length,80);
 for(let i=0;i<lim;i++){
  const map={};let score=0;
  (rows[i]||[]).forEach((c,j)=>{if(typeof c!=='string')return;const h=normH(c);if(!h||h.length>40)return;
   for(const[f,kws]of HDR){if(map[f]!=null)continue;if(kws.some(k=>kwMatch(h,k))){map[f]=j;score++;break;}}});
  const ok=map.date!=null&&(map.dr!=null||map.cr!=null||map.amt!=null);
  if(ok&&(!best||score>best.score))best={idx:i,score,map};
 }
 return best;
}
/** Used when no header row is recognised: guesses columns from their content. */
function guessColumns(rows){
 const sample=rows.slice(0,250);const n=Math.max(0,...sample.map(r=>r.length));
 const dc=Array(n).fill(0),nc=Array(n).fill(0),tl=Array(n).fill(0);
 sample.forEach(r=>r.forEach((c,j)=>{if(parseDate(c,'DMY'))dc[j]++;else if(isAmountText(c))nc[j]++;else tl[j]+=String(c).length;}));
 const map={};const dj=dc.indexOf(Math.max(...dc,0));if(dj>=0&&dc[dj]>0)map.date=dj;
 const nums=nc.map((v,j)=>[v,j]).filter(([v,j])=>v>=Math.max(2,(dc[dj]||0)*0.3)&&j!==dj).map(x=>x[1]);
 if(nums.length>=3){map.dr=nums[nums.length-3];map.cr=nums[nums.length-2];map.bal=nums[nums.length-1];}
 else if(nums.length===2){map.amt=nums[0];map.bal=nums[1];}else if(nums.length===1)map.amt=nums[0];
 const tj=tl.map((v,j)=>[v,j]).filter(([v,j])=>j!==dj&&!nums.includes(j)).sort((a,b)=>b[0]-a[0])[0];if(tj&&tj[0]>0)map.desc=tj[1];

  out.push({k:st.peakUtil>=0.85?'bad':st.peakUtil>=0.7?'warn':'i',t:`OD utilisation ${st.peakUtil>=0.85?'reached a high level of':'peaked at'} ${pct(st.peakUtil)} (${rs(st.odMax.od)}) on ${dmy(st.odMax.date)}, in ${weekPhrase(day)}.`});}
 const inc=st.tx.filter(t=>GROUP[t.cat]==='INCOME'),outs=st.tx.filter(t=>['PAYMENT','EXPENSE'].includes(GROUP[t.cat]));
 const incT=sum(inc,t=>t.cr-t.dr),outT=sum(outs,t=>t.dr-t.cr);
 if(incT>0&&outT>0){const early=sum(inc.filter(t=>+t.date.slice(8)<=10),t=>t.cr-t.dr)/incT,late=sum(outs.filter(t=>+t.date.slice(8)>20),t=>t.dr-t.cr)/outT;
  if(early>=0.4&&late>=0.4)out.push({k:'warn',t:`${pct(late)} of payments were made after the 20th, while ${pct(early)} of collections arrived by the 10th — several large payments occur before the next collection cycle.`});}
 if(st.min)out.push({k:st.lim&&-st.min.bal>st.lim?'bad':'i',t:`Lowest balance was ${rs(st.min.bal)} on ${dmy(st.min.date)}${st.max?`; highest was ${rs(st.max.bal)} on ${dmy(st.max.date)}`:''}.`});
 out.push({k:st.net<0?'warn':'good',t:st.net<0?`Net cash flow was negative: debits exceeded credits by ${rs(-st.net)}.`:`Net cash flow was positive: credits exceeded debits by ${rs(st.net)}.`});
 if(st.ret.length)out.push({k:'bad',t:`${st.ret.length} customer cheque${st.ret.length>1?'s were':' was'} returned (${rs(sum(st.ret,t=>t.dr-t.cr))}) — follow up with the customers concerned.`});
 if(st.nr.length)out.push({k:'warn',t:`${st.nr.length} transaction${st.nr.length>1?'s':''} (${rs(sum(st.nr,t=>t.cr+t.dr))}) are still unclassified — category figures are incomplete until they are reviewed.`});
 return out;
}
/** Section 13: looks across recent complete months for timing problems. */
function patterns(ids){
 const last=latestC(ids);const months=monthsWithData(ids).filter(m=>last&&monthEnd(m)<=last).slice(-6);
 if(months.length<2)return null;
 const bl=['1st–10th','11th–20th','21st–end'];const bk=d=>d<=10?0:d<=20?1:2;
 const inc=[0,0,0],pay=[0,0,0],sup=[0,0,0],odDay=[0,0,0];
 const set=new Set(months);
 for(const t of S.txns){if(!ids.includes(t.acc)||!set.has(monthKey(t.date)))continue;const b=bk(+t.date.slice(8));const g=GROUP[t.cat];
  if(g==='INCOME')inc[b]+=t.cr-t.dr;if(g==='PAYMENT'||g==='EXPENSE')pay[b]+=t.dr-t.cr;if(g==='PAYMENT')sup[b]+=t.dr-t.cr;}
 for(const m of months){const ser=daily(ids,m+'-01',monthEnd(m)).filter(x=>x.known);if(ser.length){const mx=ser.reduce((a,b)=>b.od>a.od?b:a);if(mx.od>0)odDay[bk(+mx.date.slice(8))]++;}}
 const sh=a=>{const t=sum(a);return a.map(x=>t>0?x/t:0);};
 const incS=sh(inc),payS=sh(pay),supS=sh(sup);const am=a=>a.indexOf(Math.max(...a));
 const cards=[];
 const sb=am(supS),ib=am(incS),pb=am(payS),ob=am(odDay);
 if(sum(sup)>0&&sb!==ib&&supS[sb]>=0.4)cards.push({problem:`${pct(supS[sb])} of supplier/purchase payments fall between the ${bl[sb]} of each month (last ${months.length} months).`,obs:`Customer collections are concentrated between the ${bl[ib]} (${pct(incS[ib])} of collections).`,con:'Payment dates may need to be coordinated with collection timing — for example, agreeing supplier payment dates that fall after the main collection window.'});
 else if(pb!==ib&&payS[pb]>=0.45)cards.push({problem:`${pct(payS[pb])} of all payments and expenses fall between the ${bl[pb]}.`,obs:`Collections peak between the ${bl[ib]} (${pct(incS[ib])}).`,con:'Consider spreading non-critical payments towards the collection window.'});
 if(odDay[ob]>=Math.ceil(months.length/2)&&sum(odDay)>0)cards.push({problem:`The highest OD use of the month happened between the ${bl[ob]} in ${odDay[ob]} of the last ${months.length} months.`,obs:'This is the tightest period for the facility each month.',con:'Keep headroom for this window: avoid scheduling flexible payments into it where possible.'});
 return{months,bl,incS,payS,supS,cards};
}

/* ---------- 8. FORECAST ---------- */
function forecast(ids,{horizon=60,baseline=false}={}){
 const asOf=latestC(ids);if(!asOf)return null;
 const start=addDays(asOf,1),end=addDays(start,horizon-1);
 const startBal=balC(ids,asOf)??0,limit=limitC(ids);
 const events=S.plans.filter(p=>p.status==='open'&&ids.includes(p.acc)).map(p=>{const k=PLAN_KINDS[p.kind]||PLAN_KINDS.EXPENSE;
  return{...p,amt:k.sign*p.amount,type:k.type,kindLabel:k.label,eff:p.date<start?start:p.date,late:p.date<start};})
  .filter(e=>e.eff<=end).sort((a,b)=>a.eff<b.eff?-1:a.eff>b.eff?1:b.amt-a.amt);
 let base=0,baseInfo=null;
 if(baseline){const ms=monthsWithData(ids).filter(m=>monthEnd(m)<=asOf).slice(-3);
  if(ms.length){let inc=0,out=0,days=0;ms.forEach(m=>{const st=periodStats(ids,m+'-01',monthEnd(m));inc+=st.income;out+=st.out;days+=+monthEnd(m).slice(8);});base=(inc-out)/days;baseInfo={months:ms,perDay:base,total:base*horizon};}}
 const beyond=S.plans.filter(p=>p.status==='open'&&ids.includes(p.acc)&&p.date>end).length;
 return{ids,asOf,start,end,horizon,startBal,limit,events,base,baseInfo,beyond,...project(events,startBal,start,end,limit,base)};
}
function project(events,startBal,start,end,limit,base){
 const byDay={};events.forEach(e=>(byDay[e.eff]||(byDay[e.eff]=[])).push(e));
 const days=[];let bal=startBal,min={bal:startBal,date:addDays(start,-1)},breach=null,peakExcess=0,peakDate=null,maxOD=Math.max(0,-startBal),maxODDate=addDays(start,-1);
 for(let d=start;d<=end;d=addDays(d,1)){
  const ev=byDay[d]||[];const inn=sum(ev.filter(e=>e.amt>0),e=>e.amt),out=sum(ev.filter(e=>e.amt<0),e=>-e.amt);
  bal=bal+inn-out+base;const od=Math.max(0,-bal);days.push({date:d,bal,inn,out,od,ev});
  if(bal<min.bal)min={bal,date:d};if(od>maxOD){maxOD=od;maxODDate=d;}
  if(limit&&od>limit){const ex=od-limit;if(!breach)breach={date:d,excess:ex};if(ex>peakExcess){peakExcess=ex;peakDate=d;}}
 }
 return{days,min,breach,peakExcess,peakDate,maxOD,maxODDate,maxUtil:limit?maxOD/limit:null,endBal:bal};
}
/** Section 15: why the breach happens and what could be moved. Options only — nothing is executed. */
function odAnalysis(f){
 if(!f||!f.breach)return null;const b=f.breach.date;
 const outs=f.events.filter(e=>e.amt<0&&e.eff<=b).sort((x,y)=>x.amt-y.amt);
 const before=f.events.filter(e=>e.amt>0&&e.eff<=b);
 const after=f.events.filter(e=>e.amt>0&&e.eff>b&&daysBetween(b,e.eff)<=45);
 const flex=outs.filter(e=>e.flexible);const flexTotal=sum(flex,e=>-e.amt);
 let target=null,cum=0;for(const e of after){cum+=e.amt;if(cum>=Math.min(flexTotal,f.peakExcess)){target=e.eff;break;}}
 if(!target)target=after.length?after[after.length-1].eff:addDays(b,14);
 const newDate=addDays(target,1);const endS=newDate>f.end?addDays(newDate,7):f.end;
 const resched=flex.map(e=>({...e,newDate:e.eff>newDate?e.eff:newDate}));
 const mv=list=>f.events.map(e=>{const r=list.find(x=>x.id===e.id);return r?{...e,eff:r.newDate}:e;});
 const scenA=flex.length?project(mv(resched),f.startBal,f.start,endS,f.limit,f.base):null;
 const accelDate=addDays(b,-1)<f.start?f.start:addDays(b,-1);
 const accel=after.map(e=>({...e,newDate:accelDate}));
 const scenB=accel.length?project(mv(accel),f.startBal,f.start,f.end,f.limit,f.base):null;
 return{b,outs,before,after,flex,flexTotal,resched,newDate,scenA,accel,accelDate,scenB};
}
/** Section 16: prioritised items for management. */
function actionItems(idsIn){
 const items=[];const ids=idsIn||allAccIds();
 if(!S.txns.length)return[{p:'info',t:'No bank data yet',d:'Upload the first monthly statement, or load the demo data from the dashboard.'}];
 const today=todayIso();const sets=ids.length>1?[ids,...ids.map(i=>[i])]:[ids];let riskFound=false;
 sets.forEach((set,si)=>{
  const f=forecast(set,{horizon:S.settings.horizon,baseline:S.settings.baseline});if(!f)return;
  const name=set.length>1?'all accounts combined':accName(set[0]);
  if(!f.limit&&f.startBal<0)items.push({p:'att',t:`No OD limit is set for ${esc(name)}`,d:'OD risk cannot be measured until the approved limit is entered.',a:'Enter the approved OD limit in Settings → Bank accounts.',link:'#settings'});
  if(f.breach){riskFound=true;const an=odAnalysis(f);
   const rsch=an.resched.slice(0,2).map(e=>`${esc(e.party||e.kindLabel)} ${rs(-e.amt)} (${dmy(e.eff)})`).join(' and ');
   items.push({p:'high',t:`OD limit breach projected on ${dmy(f.breach.date)} — ${esc(name)}`,
    d:`Projected OD use exceeds the approved ${rs(f.limit)} by ${rs(f.breach.excess)}, peaking at ${rs(f.peakExcess)} over the limit on ${dmy(f.peakDate)}.`,
    a:an.resched.length?`Review whether ${rsch}${an.resched.length>2?` and ${an.resched.length-2} other flexible payment${an.resched.length>3?'s':''}`:''} can be scheduled after ${dmy(an.newDate)}.${an.scenA&&!an.scenA.breach?' In the projection, moving the flexible payments removes the breach.':' Moving flexible payments alone does not remove the breach — also review collections and funding ('+rs(f.peakExcess)+' required).'}`:`No flexible payments are scheduled before the breach. Funding of ${rs(f.peakExcess)} or faster collections would be required.`,link:'#forecast'});
  }else if(f.maxUtil!=null&&f.maxUtil>=0.85){riskFound=true;
   items.push({p:'att',t:`OD utilisation projected to reach ${pct(f.maxUtil)} on ${dmy(f.maxODDate)} — ${esc(name)}`,d:`Available headroom falls to ${rs(f.limit-f.maxOD)}.`,a:'Review upcoming non-critical payments and follow up the expected collections.',link:'#forecast'});}
  if(si===0&&f.limit){let n=0;
   for(const e of f.events.filter(e=>e.amt<0&&e.flexible)){if(n>=3)break;
    const col=f.events.find(c=>c.amt>0&&c.eff>e.eff&&daysBetween(e.eff,c.eff)<=10&&c.amt>=-e.amt*0.5);const day=f.days.find(d=>d.date===e.eff);
    if(col&&day&&day.od/f.limit>=0.8){n++;items.push({p:'high',t:`${esc(e.kindLabel)} of ${rs(-e.amt)}${e.party?' ('+esc(e.party)+')':''} is scheduled on ${dmy(e.eff)}, before an expected collection of ${rs(col.amt)} on ${dmy(col.eff)}`,d:`OD utilisation on ${dmy(e.eff)} is projected at ${pct(day.od/f.limit)}.`,a:`Review whether the payment can be scheduled after ${dmy(col.eff)}.`,link:'#plans'});}}}
 });
 const lateIn=S.plans.filter(p=>p.status==='open'&&ids.includes(p.acc)&&PLAN_KINDS[p.kind].sign>0&&p.date<today).sort((a,b)=>a.date<b.date?-1:1);
 if(lateIn.length)items.push({p:'att',t:`${lateIn.length} expected receipt${lateIn.length>1?'s':''} totalling ${rs(sum(lateIn,p=>p.amount))} ${lateIn.length>1?'are':'is'} overdue`,d:`Oldest: ${esc(lateIn[0].party||'—')} due ${dmy(lateIn[0].date)}. The forecast still counts ${lateIn.length>1?'them':'it'} as coming in.`,a:'Follow up these customers, or update the expected dates in Commitments.',link:'#plans'});
 const asOf=latestC(ids);if(asOf&&daysBetween(asOf,today)>35)items.push({p:'att',t:`Bank data is ${daysBetween(asOf,today)} days old`,d:`Latest statement ends ${dmy(asOf)}. The forecast starts from that date.`,a:'Upload the latest monthly statement.',link:'#upload'});
 const nr=S.txns.filter(t=>ids.includes(t.acc)&&t.cat==='Needs Review');
 if(nr.length)items.push({p:'att',t:`${nr.length} transaction${nr.length>1?'s':''} need${nr.length>1?'':'s'} a category`,d:`${rs(sum(nr,t=>t.cr+t.dr))} is not yet in the income/expense analysis.`,a:'Classify them once — the system remembers the keyword for next month.',link:'#review'});
 const un=S.statements.filter(s=>ids.includes(s.acc)&&s.recon!=null&&Math.abs(s.recon)>=0.51);
 if(un.length)items.push({p:'att',t:`${un.length} statement${un.length>1?'s':''} imported without reconciling`,d:un.map(s=>`${esc(s.file)} (difference ${rs(s.recon)})`).join('; '),a:'Check the file and column mapping, then Reprocess from Upload history.',link:'#history'});
 if(asOf){const ret=S.txns.filter(t=>ids.includes(t.acc)&&t.cat==='Returned Cheque'&&daysBetween(t.date,asOf)<=60);
  if(ret.length)items.push({p:'att',t:`${ret.length} returned cheque${ret.length>1?'s':''} in the last 60 days`,d:`Total ${rs(sum(ret,t=>t.dr-t.cr))}.`,a:'Recover the amounts and review credit terms for these customers.',link:'#cheques'});}
 if(!riskFound&&asOf){const f=forecast(ids,{horizon:S.settings.horizon,baseline:S.settings.baseline});
  items.push({p:'ok',t:'Projected cash flow remains within the approved OD facility',d:f?`Through ${dmy(f.end)}. Lowest projected balance ${rs(f.min.bal)} on ${dmy(f.min.date)}${f.maxUtil!=null?` (${pct(f.maxUtil)} OD use)`:''}. The projection only includes commitments entered in Commitments.`:'',link:'#forecast'});}
 const ord={high:0,att:1,ok:2,info:3};return items.sort((a,b)=>ord[a.p]-ord[b.p]);
}

 let h=`<h1>${IMP&&IMP.replaceStmt?'Reprocess statement':'Upload monthly bank statement'}</h1><div class="steps">${names.map((n,i)=>`<span class="${i+1===step?'on':i+1<step?'done':''}">${i+1}. ${n}</span>`).join('')}</div>`;

function bindDrop(){const d=$('#drop');if(!d)return;['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('on');}));
 ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('on');}));d.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(f)handleFile(f);});}

async function handleFile(file,replaceStmt){
 toast('Reading '+file.name+' …');
 try{const buf=await file.arrayBuffer();const isPdf=/\.pdf$/i.test(file.name);
  const src=isPdf?await readPdf(buf):readSheet(file.name,buf);
  src.fileName=file.name;src.type=file.type||'';src.buf=buf;
  if(!src.rows.length)throw new Error('The file is empty.');
  const det=detectHeader(src.rows);let hIdx,map;
  if(det){hIdx=det.idx;map=det.map;const saved=S.settings.mappings[headerSig(src.rows[hIdx])];if(saved)map={...saved};}
  else{hIdx=-1;map=guessColumns(src.rows);}
  if(replaceStmt&&replaceStmt.map&&replaceStmt.hIdx!=null&&replaceStmt.hIdx<src.rows.length){hIdx=replaceStmt.hIdx;map={...replaceStmt.map};}
  map=validateMap(src.rows,hIdx,map);
  IMP={src,hIdx,map,order:S.settings.dateOrder,showMap:!det||(isPdf&&!src.pdfAligned),saveMap:true,override:false,acc:replaceStmt?replaceStmt.acc:null,newAcc:null,replaceStmt:replaceStmt?replaceStmt.id:null,manualOpening:null};
  recompute(true);
  if(location.hash!=='#upload')location.hash='#upload';else render();
  if(!IMP.fin.out.length)toast('No transactions were found automatically. Use “Map columns” to show which column is which.',7000);
 }catch(e){console.error(e);toast(e.message||String(e),7000);}
}
function recompute(first){
 const I=IMP;const ex=extract(I.src.rows,I.hIdx,I.map,I.order);
 I.fin=finalize(ex,I.src.preText+'\n'+I.src.fileName);
 if(I.manualOpening!=null&&I.fin.opening==null){I.fin.opening=I.manualOpening;if(!I.fin.hasBal)I.fin.closing=round2(I.manualOpening+I.fin.cr-I.fin.dr);}
 if(first&&I.acc==null){const text=I.src.preText+' '+I.src.fileName;const num=detectAccNo(text);I.detNo=num;
  const same=(a,b)=>a&&b&&(a===b||(a.length>=8&&b.length>=8&&(a.endsWith(b)||b.endsWith(a))));
  const m=num?S.accounts.find(a=>same(digits(a.number),num)):null;
  if(m)I.acc=m.id;else if(!num&&S.accounts.length)I.acc=S.accounts[0].id;else I.acc='NEW';
  I.newAcc={name:'',bank:guessBank(text),number:num||'',odLimit:''};}
 if(!I.newAcc)I.newAcc={name:'',bank:'',number:'',odLimit:''};
 buildRows();
}
function buildRows(){
 const I=IMP;const acc=I.acc;const old=Object.fromEntries((I.rows||[]).map(r=>[r.key+'#'+r.row,r]));
 const existing=new Set(S.txns.filter(t=>t.acc===acc&&t.stmt!==I.replaceStmt).map(t=>t.key));
 const prevManual=I.replaceStmt?Object.fromEntries(S.txns.filter(t=>t.stmt===I.replaceStmt&&t.src==='manual').map(t=>[t.key,t])):{};
 const seen={};
 I.rows=I.fin.out.map(t=>{const key=txKey(acc,t);const p=old[key+'#'+t.row];const c=classify(t);const pm=prevManual[key];
  seen[key]=(seen[key]||0)+1;const dup=existing.has(key);
  return{...t,key,dup,include:p?p.include:!dup,cat:p&&p.manual?p.cat:pm?pm.cat:c.cat,party:p&&p.manual?p.party:pm?pm.party:c.party,src:c.src,manual:p?p.manual:!!pm,review:p?p.review:c.cat==='Needs Review',kw:p?p.kw:suggestKw(t.desc),remember:p?p.remember:true};});
 I.rows.forEach(r=>r.dupInFile=seen[r.key]>1);
 const f=I.fin;I.overlap=f.from?S.statements.filter(s=>s.acc===acc&&s.id!==I.replaceStmt&&s.from<=f.to&&s.to>=f.from):[];
}

ACT.confirmImport=async()=>{
 const I=IMP,f=I.fin;let accId=I.acc;
 if(accId==='NEW'){const a={id:uid(),name:I.newAcc.name.trim(),bank:I.newAcc.bank,number:I.newAcc.number,odLimit:+I.newAcc.odLimit||0};await DB.put('accounts',a);S.accounts.push(a);accId=a.id;}
 const old=I.replaceStmt?S.statements.find(s=>s.id===I.replaceStmt):null;
 if(old){const ids=S.txns.filter(t=>t.stmt===old.id).map(t=>t.id);await DB.delMany('txns',ids);S.txns=S.txns.filter(t=>t.stmt!==old.id);await DB.del('statements',old.id);S.statements=S.statements.filter(s=>s.id!==old.id);}
 const fileId=old&&old.fileId?old.fileId:uid();if(!(old&&old.fileId))await DB.put('files',{id:fileId,name:I.src.fileName,type:I.src.type,data:I.src.buf});
 const inc=I.rows.filter(r=>r.include);const stId=uid();
 const st={id:stId,acc:accId,file:I.src.fileName,fileId,kind:I.src.kind,from:f.from,to:f.to,opening:f.opening,closing:f.closing,cr:f.cr,dr:f.dr,count:I.rows.length,imported:inc.length,dups:I.rows.length-inc.length,
  uploaded:old?old.uploaded:new Date().toISOString(),reprocessed:old?new Date().toISOString():null,recon:f.recon,
  status:f.recon==null?'Imported – no balances to reconcile':Math.abs(f.recon)<0.51?'Imported':'Imported – UNRECONCILED',map:I.map,hIdx:I.hIdx,order:f.order};
 const tx=inc.map(r=>({id:uid(),acc:accId,stmt:stId,date:r.date,desc:r.desc,dr:r.dr,cr:r.cr,bal:r.bal,chq:r.chq,ref:r.ref,seq:r.row,cat:r.cat,party:r.party,src:r.manual?'manual':r.src,key:txKey(accId,r)}));
 const newRules=[];
 inc.filter(r=>r.manual&&r.remember&&String(r.kw).trim()&&r.cat!=='Needs Review').forEach(r=>{const w=normWords(r.kw);if(!newRules.some(x=>x.words===w&&x.cat===r.cat))newRules.push({id:uid(),words:w,dir:r.cr>r.dr?'in':'out',cat:r.cat,party:r.party||'',builtin:false,created:Date.now()});});
 await DB.put('statements',st);await DB.putMany('txns',tx);if(newRules.length)await DB.putMany('rules',newRules);
 S.statements.push(st);S.txns.push(...tx);S.rules.push(...newRules);
 let more=0;if(newRules.length)more=await reapplyRules(false);
 const closed=await matchChequePlans(tx);
 if(I.saveMap&&I.hIdx>=0){S.settings.mappings[headerSig(I.src.rows[I.hIdx])]=I.map;await saveSettings();}
 derive();IMP=null;S.ui.rp={type:'month',key:monthKey(f.to)};
 toast(`${old?'Reprocessed':'Imported'} ${tx.length} transactions${more?`; ${more} older ones classified by your new rules`:''}${closed?`; ${closed} expected cheque${closed>1?'s':''} marked cleared`:''}.`,5000);
 location.hash='#reports';
};
async function reapplyRules(all,stmtId){
 const ch=[];for(const t of S.txns){if(t.src==='manual')continue;if(stmtId&&t.stmt!==stmtId)continue;if(!all&&!stmtId&&t.cat!=='Needs Review')continue;
  const c=classify(t);if(c.cat!==t.cat||c.party!==t.party){t.cat=c.cat;t.party=c.party;t.src=c.src;ch.push(t);}}
 if(ch.length)await DB.putMany('txns',ch.map(({rb,...t})=>t));return ch.length;
}
async function matchChequePlans(tx){
 const ch=[];for(const p of S.plans){if(p.status!=='open'||!p.chq||!['CHQ_IN','CHQ_OUT'].includes(p.kind))continue;
  const t=tx.find(t=>t.chq&&t.chq.replace(/^0+/,'')===String(p.chq).replace(/^0+/,'')&&(p.kind==='CHQ_IN'?t.cr>0:t.dr>0)&&!RET_RX.test(t.desc));
  if(t){p.status='done';p.doneDate=t.date;p.doneNote='Cleared per bank statement';ch.push(p);}}
 if(ch.length)await DB.putMany('plans',ch);return ch.length;
}

/* ---- Monthly report ---- */
const fyYear=d=>{const s=S.settings.fyStart,y=+d.slice(0,4),m=+d.slice(5,7);return m>=s?y:y-1;};
const fyFrom=y=>`${y}-${pad(S.settings.fyStart)}-01`;
const fyLabel=y=>S.settings.fyStart===1?`FY ${y}`:`FY ${y}/${String(y+1).slice(2)}`;
const rangeM=(from,n)=>({from,to:addDays(addMonths(from,n),-1)});
function resolvePeriod(ids){
 const p=S.ui.rp,months=monthsWithData(ids),last=latestC(ids)||todayIso(),lm=monthKey(last);let cur,prev,label,pl;
 switch(p.type){
  case'quarter':{const y=p.y??fyYear(last);const q=p.q??(Math.floor(((+last.slice(5,7)-S.settings.fyStart+12)%12)/3)+1);cur=rangeM(addMonths(fyFrom(y),3*(q-1)),3);prev=rangeM(addMonths(cur.from,-3),3);label=`Q${q} ${fyLabel(y)}`;pl='the previous quarter';break;}
  case'fy':{const y=p.y??fyYear(last);cur=rangeM(fyFrom(y),12);prev=rangeM(fyFrom(y-1),12);label=fyLabel(y);pl=fyLabel(y-1);break;}
  case'ytd':{const y=fyYear(last);cur={from:fyFrom(y),to:last};prev={from:fyFrom(y-1),to:(+last.slice(0,4)-1)+last.slice(4)};label=`YTD ${fyLabel(y)} (to ${dmy(last)})`;pl='the same period last year';break;}
  case'last3':case'last6':case'last12':{const n=+p.type.slice(4);const f=addMonths(lm+'-01',-(n-1));cur={from:f,to:monthEnd(lm)};prev=rangeM(addMonths(f,-n),n);label=`Last ${n} months`;pl=`the previous ${n} months`;break;}
  case'custom':{const from=p.from||lm+'-01',to=p.to||last;const len=daysBetween(from,to)+1;cur={from,to};prev={from:addDays(from,-len),to:addDays(from,-1)};label=`${dmy(from)} – ${dmy(to)}`;pl=`the previous ${len} days`;break;}
  default:{const k=p.key&&months.includes(p.key)?p.key:lm;cur={from:k+'-01',to:monthEnd(k)};const pk=monthKey(addMonths(k+'-01',-1));prev={from:pk+'-01',to:monthEnd(pk)};label=monthLabel(k);pl=monthLabel(pk);}
 }
 return{cur,prev,label,pl};
}
function cmpRow(name,a,b,upIsBad,isPct){const c=isPct?(a!=null&&b!=null?a-b:null):chg(a,b);const th=S.settings.highlight/100;const sig=c!=null&&(isPct?Math.abs(c)>=0.05:Math.abs(c)>=th);
 const cls=sig?((upIsBad?c>0:c<0)?'up':'dn'):'';const f=v=>isPct?pct(v):rs(v);
 return`<tr><td>${name}</td><td class="n">${f(b)}</td><td class="n">${f(a)}</td><td class="n ${cls}">${a!=null&&b!=null?(isPct?(c>0?'+':'')+(c*100).toFixed(1)+' pts':(a-b>=0?'+':'')+fmt(a-b)):'–'}</td><td class="n ${cls}">${!isPct&&c!=null&&isFinite(c)?(c>0?'▲ ':'▼ ')+pct(Math.abs(c)):''}</td></tr>`;}

 <td style="white-space:nowrap"><button class="sm" data-act="editPlan" data-id="${p.id}">Edit</button> <button class="sm" data-act="planDone" data-id="${p.id}" title="It has happened">Done</button> <button class="sm" data-act="planCancel" data-id="${p.id}">Cancel</button> <button class="sm d" data-act="planDel" data-id="${p.id}">✕</button></td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">Nothing entered yet.</p>'}

/* ---- Forecast & OD ---- */
function evRow(e){return`${badge(e.type)} ${esc(e.party||e.kindLabel)} <b class="${e.amt<0?'neg':'pos'}">${e.amt<0?'−':'+'}${fmt(Math.abs(e.amt))}</b>${e.flexible?' <span class="b b-grey">FLEX</span>':''}${e.late?' <span class="b b-red">OVERDUE</span>':''}`;}
VIEWS.forecast=()=>{
 const ids=accIds();const hz=S.ui.hz||S.settings.horizon;const f=forecast(ids,{horizon:hz,baseline:S.settings.baseline});
 if(!f)return`<h1>Forecast & OD</h1><div class="card">Upload a statement first — the forecast starts from the latest actual bank balance.</div>`;
 const an=odAnalysis(f);const E=f.events;const s=k=>sum(E.filter(e=>e.kind===k),e=>Math.abs(e.amt));
 const inflow=sum(E.filter(e=>e.amt>0),e=>e.amt),outflow=sum(E.filter(e=>e.amt<0),e=>-e.amt);
 const eq=[['Current bank position','ACTUAL',f.startBal,`as of ${dmy(f.asOf)}`],['+ Expected collections','EXPECTED',s('COLLECTION')],['+ Expected incoming cheques','EXPECTED',s('CHQ_IN')],['+ Planned other inflows','PLANNED',s('INFLOW')],
  ['− Scheduled purchases / supplier payments','PLANNED',-s('SUPPLIER')],['− Scheduled expenses','PLANNED',-s('EXPENSE')],['− Outgoing cheques issued','EXPECTED',-s('CHQ_OUT')]];
 if(f.baseInfo)eq.push(['± Typical flow (3-month average)','FORECAST',f.base*f.horizon,`${rs(f.base)}/day from ${f.baseInfo.months.map(monthLabel).join(', ')}`]);
 let risk;
 if(an){risk=`<div class="al high"><div class="t" style="font-size:16px">🔴 OD LIMIT RISK</div><div>Projected OD requirement exceeds the available facility.</div>
 <div class="grid" style="margin-top:10px">${kpi('Date of expected breach',dmy(f.breach.date),'FORECAST','',true)}${kpi('Excess on that day',rs(f.breach.excess),'FORECAST','',true)}${kpi('Peak excess',rs(f.peakExcess),'FORECAST','on '+dmy(f.peakDate),true)}${kpi('Funding required',rs(f.peakExcess),'FORECAST','to stay within the limit')}</div>
 <h3>Transactions contributing to the breach (up to ${dmy(an.b)})</h3><table><tbody>${an.outs.slice(0,10).map(e=>`<tr><td>${dmy(e.eff)}</td><td>${evRow(e)}</td></tr>`).join('')}</tbody></table>
 <div class="g2" style="margin-top:8px"><div><h3>Expected collections before the breach</h3>${an.before.length?`<table><tbody>${an.before.map(e=>`<tr><td>${dmy(e.eff)}</td><td>${evRow(e)}</td></tr>`).join('')}</tbody></table>`:'<p class="small">None.</p>'}</div>
 <div><h3>Expected collections after the breach (45 days)</h3>${an.after.length?`<table><tbody>${an.after.map(e=>`<tr><td>${dmy(e.eff)}</td><td>${evRow(e)}</td></tr>`).join('')}</tbody></table>`:'<p class="small">None entered.</p>'}</div></div>
 <h3>Possible payment scheduling options</h3>${an.resched.length?`<table><tbody>${an.resched.map(e=>`<tr><td>${evRow(e)}</td><td>${dmy(e.eff)} → <b>${dmy(e.newDate)}</b></td></tr>`).join('')}</tbody></table>
 <p class="small">If all ${an.resched.length} flexible payment${an.resched.length>1?'s':''} (${rs(an.flexTotal)}) move to ${dmy(an.newDate)}: ${an.scenA.breach?`<b class="neg">the breach still occurs on ${dmy(an.scenA.breach.date)} (peak excess ${rs(an.scenA.peakExcess)})</b>`:`<b class="pos">no breach — peak OD utilisation ${pct(an.scenA.maxUtil)} on ${dmy(an.scenA.maxODDate)}</b>`}.</p>`:'<p class="small">No payments before the breach are marked flexible. Mark movable payments as “flexible” in Commitments to see options.</p>'}
 <h3>Possible collection acceleration options</h3>${an.accel.length?`<p class="small">If the collections due after the breach (${rs(sum(an.accel,e=>e.amt))}) are received by ${dmy(an.accelDate)}: ${an.scenB.breach?`<b class="neg">the breach still occurs on ${dmy(an.scenB.breach.date)} (peak excess ${rs(an.scenB.peakExcess)})</b>`:`<b class="pos">no breach</b>`}.</p><table><tbody>${an.accel.slice(0,8).map(e=>`<tr><td>${evRow(e)}</td><td>${dmy(e.eff)} → ${dmy(e.newDate)}</td></tr>`).join('')}</tbody></table>`:'<p class="small">No expected collections after the breach date.</p>'}
 <p class="small muted" style="margin-top:8px">These are options for management to review. The system does not change any payment.</p></div>`;}
 else if(f.maxUtil!=null&&f.maxUtil>=0.85)risk=`<div class="al att"><div class="t">🟠 OD utilisation projected to reach ${pct(f.maxUtil)} on ${dmy(f.maxODDate)}</div><div class="small">Headroom falls to ${rs(f.limit-f.maxOD)}. Review upcoming non-critical payments and expected collections.</div></div>`;
 else risk=`<div class="al ok"><div class="t">🟢 Projected cash flow remains within the approved OD facility</div><div class="small">${f.limit?`Peak projected OD use ${rs(f.maxOD)} (${pct(f.maxUtil)}) on ${dmy(f.maxODDate)}.`:'No OD limit set for this account.'}</div></div>`;
 const evDays=f.days.filter(d=>d.ev.length);
 return`<h1>Cash-flow forecast & OD control</h1>
 <div class="card noprint"><div class="form"><label>Horizon<select data-chg="hz">${[30,60,90,120].map(n=>`<option value="${n}" ${hz===n?'selected':''}>${n} days</option>`).join('')}</select></label>
 <label class="ck"><input type="checkbox" data-chg="baseline" ${S.settings.baseline?'checked':''}> Add typical monthly flow (3-month average)</label><div class="row"><a class="btn" href="#plans">Edit commitments →</a></div></div>
 <p class="muted small">Leave the average flow off if you enter all expected collections and payments yourself — otherwise they are counted twice.</p></div>
 <div class="grid">${kpi('Starting balance',rs(f.startBal),'ACTUAL','as of '+dmy(f.asOf),f.startBal<0)}${kpi('Expected + planned inflows',rs(inflow),'EXPECTED','next '+f.horizon+' days')}${kpi('Committed + planned outflows',rs(outflow),'PLANNED','next '+f.horizon+' days')}
 ${kpi('Projected balance '+dmy(f.end),rs(f.endBal),'FORECAST','',f.endBal<0)}${kpi('Projected lowest balance',rs(f.min.bal),'FORECAST','on '+dmy(f.min.date),f.min.bal<0)}${kpi('Available OD at lowest point',f.limit?rs(f.limit+f.min.bal):'–','FORECAST','',f.limit&&f.limit+f.min.bal<0)}</div>
 ${risk}
 <div class="g2"><div class="card"><h2>Balance projection</h2>${forecastChart('fChart',ids,f,300)}</div>
 <div class="card"><h2>Projected bank position</h2><table class="eq">${eq.map(([l,t,v,n])=>`<tr><td>${l} ${badge(t)}${n?`<div class="muted small">${n}</div>`:''}</td><td class="n ${v<0?'neg':''}">${fmt(v)}</td></tr>`).join('')}
 <tr class="res"><td>= Projected bank position ${dmy(f.end)} ${badge('FORECAST')}</td><td class="n ${f.endBal<0?'neg':''}">${fmt(f.endBal)}</td></tr></table>
 ${f.beyond?`<p class="muted small">${f.beyond} commitment${f.beyond>1?'s':''} dated after ${dmy(f.end)} not included — extend the horizon to see them.</p>`:''}
 ${E.some(e=>e.late)?`<p class="small warn">Overdue items are counted on ${dmy(f.start)} (the first forecast day). Update their dates if they will be later.</p>`:''}</div></div>
 <div class="card"><h2>Day-by-day (days with movements)</h2>${evDays.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Movements</th><th class="n">In</th><th class="n">Out</th><th class="n">Projected balance</th><th class="n">OD use</th></tr></thead><tbody>
 ${evDays.map(d=>`<tr><td>${dmy(d.date)}</td><td>${d.ev.map(evRow).join('<br>')}</td><td class="n">${d.inn?fmt(d.inn):''}</td><td class="n">${d.out?fmt(d.out):''}</td><td class="n ${f.limit&&d.od>f.limit?'neg':''}">${fmt(d.bal)}</td><td class="n ${utilCls(f.limit?d.od/f.limit:null)}">${f.limit?pct(d.od/f.limit):'–'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No commitments entered for this period. <a href="#plans">Add expected collections and payments</a>.</p>'}</div>`;
};

VIEWS.cheques=()=>{
 const ids=accIds();const g={};S.txns.filter(t=>t.chq&&ids.includes(t.acc)).forEach(t=>(g[t.acc+'|'+t.chq]||(g[t.acc+'|'+t.chq]=[])).push(t));
 const rows=Object.values(g).map(l=>{l.sort(txSort);const first=l.find(t=>!RET_RX.test(t.desc))||l[0];const ret=l.find(t=>RET_RX.test(t.desc));
  return{chq:first.chq,date:first.date,amt:first.cr||first.dr,type:first.cr>first.dr?'Incoming':'Outgoing',status:ret?'Returned':'Cleared',clear:ret?ret.date:first.date,party:first.party||first.desc,acc:first.acc};});
 S.plans.filter(p=>p.status==='open'&&ids.includes(p.acc)&&(p.kind==='CHQ_IN'||p.kind==='CHQ_OUT')).forEach(p=>rows.push({chq:p.chq||'—',date:p.date,amt:p.amount,type:p.kind==='CHQ_IN'?'Incoming':'Outgoing',status:'Pending',clear:'',party:p.party,acc:p.acc}));
 rows.sort((a,b)=>a.date<b.date?1:-1);const f=S.ui.cf||'';const show=rows.filter(r=>!f||r.type===f||r.status===f);
 const t=k=>sum(rows.filter(r=>r.status===k),r=>r.amt);const n=k=>rows.filter(r=>r.status===k).length;

 ${show.map(r=>`<tr><td>${esc(r.chq)}</td><td>${dmy(r.date)}</td><td>${esc(r.party)}${S.accounts.length>1?`<div class="muted small">${esc(accName(r.acc))}</div>`:''}</td><td>${r.type}</td><td class="n">${fmt(r.amt)}</td><td>${r.status==='Returned'?'<span class="b b-red">RETURNED</span>':r.status==='Pending'?badge('EXPECTED')+' Pending':'<span class="b b-ACTUAL">CLEARED</span>'}</td><td>${r.clear?dmy(r.clear):''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No cheques found.</td></tr>'}</tbody></table></div></div>`;
};

 <div class="tw"><table><thead><tr><th>Name</th><th>Bank</th><th>Account no.</th><th class="n">Approved OD limit (Rs.)</th><th class="n">Transactions</th><th></th></tr></thead><tbody>
 ${S.accounts.map(a=>`<tr><td><input data-chg="accEdit" data-id="${a.id}" data-f="name" value="${esc(a.name)}"></td><td><input data-chg="accEdit" data-id="${a.id}" data-f="bank" value="${esc(a.bank)}" size="14"></td><td><input data-chg="accEdit" data-id="${a.id}" data-f="number" value="${esc(a.number)}" size="14"></td><td class="n"><input type="number" min="0" data-chg="accEdit" data-id="${a.id}" data-f="odLimit" value="${a.odLimit||0}" style="text-align:right;width:140px"></td><td class="n">${S.txns.filter(t=>t.acc===a.id).length}</td><td><button class="sm d" data-act="delAcc" data-id="${a.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No accounts yet — one is created on the first upload.</td></tr>'}</tbody></table></div></div>
 <div class="card"><h2>Classification rules</h2><p class="muted small" style="margin-top:0">If the description contains any of the keywords (comma-separated), the category and customer/supplier are set. Your rules are checked first, newest first, then the built-in rules.</p>
 <div class="form"><label>Keywords<input id="nrW" placeholder="e.g. KEELLS, JKH"></label><label>Money<select id="nrD"><option value="any">In or out</option><option value="in">In only</option><option value="out">Out only</option></select></label><label>Category<select id="nrC">${catOptions('Customer Collection')}</select></label><label>Customer / supplier<input id="nrP"></label><div class="row"><button class="p" data-act="addRule">Add rule</button><button data-act="rerun">Re-run rules on all transactions</button></div></div>
 <div class="tw" style="margin-top:10px"><table><thead><tr><th>Keywords</th><th>Money</th><th>Category</th><th>Customer / supplier</th><th></th></tr></thead><tbody>${ur.map(ruleRow).join('')||'<tr><td colspan="5" class="muted">None yet — they are created when you classify “Needs review” items.</td></tr>'}</tbody></table></div>
 <details style="margin-top:8px"><summary>Built-in rules (${br.length})</summary><div class="tw"><table><tbody>${br.map(ruleRow).join('')}</tbody></table></div></details></div>
 <div class="card"><h2>Data</h2><p class="muted small" style="margin-top:0">All data is stored in this browser on this computer${MEMORY_ONLY?' — <b class="neg">storage is blocked in this browser, data is lost when the page closes</b>':''}. Take a backup after each monthly upload. Backups do not include the original statement files.</p>
 <div class="row"><button data-act="backup">Download backup</button><label class="btn">Restore backup<input type="file" accept=".json" data-chg="restore" style="display:none"></label><button data-act="exportAll">Export all transactions (CSV)</button><button data-act="demo">Load demo data</button><button class="d" data-act="wipe">Delete all data</button></div></div>`;};
const ruleRow=r=>`<tr><td>${esc(r.words)}</td><td>${{any:'In/out',in:'In',out:'Out'}[r.dir]}</td><td>${r.cat}</td><td>${esc(r.party)}</td><td><button class="sm d" data-act="delRule" data-id="${r.id}">✕</button></td></tr>`;
CHG.set=async el=>{S.settings[el.dataset.f]=el.dataset.num?+el.value:el.value;await saveSettings();renderAccSel();toast('Saved.');};
CHG.accEdit=async el=>{const a=S.accounts.find(x=>x.id===el.dataset.id);a[el.dataset.f]=el.dataset.f==='odLimit'?+el.value||0:el.value;await DB.put('accounts',a);renderAccSel();toast('Saved.');};
ACT.addAcc=async()=>{const a={id:uid(),name:'New account',bank:'',number:'',odLimit:0};await DB.put('accounts',a);S.accounts.push(a);derive();rerender();};
ACT.delAcc=async b=>{const id=b.dataset.id;if(S.txns.some(t=>t.acc===id))return toast('This account has transactions. Delete its statements in Upload history first.',5000);if(!confirm('Delete this account?'))return;await DB.del('accounts',id);S.accounts=S.accounts.filter(a=>a.id!==id);if(S.ui.acc===id)S.ui.acc='ALL';derive();rerender();};
ACT.addRule=async()=>{const w=$('#nrW').value.split(',').map(normWords).filter(Boolean).join(',');if(!w)return toast('Enter at least one keyword.');
 const r={id:uid(),words:w,dir:$('#nrD').value,cat:$('#nrC').value,party:$('#nrP').value.trim(),builtin:false,created:Date.now()};await DB.put('rules',r);S.rules.push(r);const n=await reapplyRules(false);toast(`Rule added${n?`; ${n} transaction${n>1?'s':''} classified`:''}.`);rerender();};
ACT.delRule=async b=>{await DB.del('rules',b.dataset.id);S.rules=S.rules.filter(r=>r.id!==b.dataset.id);rerender();};
ACT.rerun=async()=>{if(!confirm('Re-apply rules to every transaction? Categories you set by hand are kept.'))return;const n=await reapplyRules(true);derive();toast(`${n} transaction${n===1?'':'s'} updated.`);rerender();};
ACT.backup=async()=>{const d={app:'bank-od-control',version:1,exported:new Date().toISOString()};for(const k of['accounts','statements','txns','rules','plans'])d[k]=S[k].map(({rb,...x})=>x);d.settings=S.settings;download(`bank-od-backup-${todayIso()}.json`,JSON.stringify(d),'application/json');};
CHG.restore=async el=>{const f=el.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='bank-od-control')throw new Error('This is not a Bank & OD Control backup.');
 if(!confirm('Replace ALL current data with this backup?'))return;for(const k of['accounts','statements','txns','rules','plans']){await DB.clear(k);await DB.putMany(k,d[k]||[]);}
 await DB.put('settings',{...DEFAULT_SETTINGS,...d.settings,id:'main'});await loadAll();toast('Backup restored.');location.hash='#dash';render();}catch(e){toast(e.message,6000);}};
ACT.exportAll=()=>download('all_transactions.csv',txCsv([...S.txns].sort(txSort)),'text/csv');
ACT.wipe=async()=>{if(!confirm('Delete ALL accounts, statements, transactions, rules and commitments? This cannot be undone.'))return;if(!confirm('Are you sure? Download a backup first if you may need the data.'))return;
 for(const k of STORES)await DB.clear(k);IMP=null;S.ui.acc='ALL';await loadAll();toast('All data deleted.');location.hash='#dash';render();};

/* ---- Demo data (6 full months + this month to yesterday; the rest of this month and next month as commitments) ---- */
function buildDemo(now,T={start:-7600000,e1:380000,e2:760000,l1:180000,l2:420000,s1:1000000,s2:1650000}){
 let seed=20260401;const rnd=()=>(seed=(seed*48271)%2147483647)/2147483647;const between=(a,b)=>Math.round((a+rnd()*(b-a))/1000)*1000;
 const acc={id:'demo-acc',name:'Commercial Bank – Current A/C (DEMO)',bank:'Commercial Bank',number:'1000123456',odLimit:10000000};
 const today=iso(now),asOf=addDays(today,-1),curM=monthKey(today);
 const months=[];for(let i=6;i>=0;i--)months.push(monthKey(addMonths(curM+'-01',-i))); // 6 full months + this month to yesterday
 const cust=[['KEELLS','Keells Super'],['ARPICO','Arpico Supercentre'],['CARGILLS','Cargills Food City'],['LAUGFS','Laugfs Super'],['SATHOSA','Lanka Sathosa'],['GLOMARK','Glomark']];
 const sup=[['PRIMA','Prima Ceylon'],['SERENDIB FLOUR','Serendib Flour Mills'],['CIC','CIC Holdings'],['DPL PACKAGING','DPL Packaging']];
 const rules=[...cust.map(([k,n],i)=>({id:'demo-r'+i,words:k,dir:'in',cat:'Customer Collection',party:n,builtin:false,created:1000+i})),...sup.map(([k,n],i)=>({id:'demo-s'+i,words:k,dir:'out',cat:'Supplier Payment',party:n,builtin:false,created:2000+i}))];
 let bal=T.start,chqOut=345001,chqIn=500100;const stmts=[],lists=[],future=[];
 months.forEach((mk,mi)=>{
  const isCur=mk===curM;const end=+monthEnd(mk).slice(8),list=[];const add=(d,desc,dr,cr,chq='')=>list.push({date:mk+'-'+pad(d),desc,dr,cr,chq});const drift=1-mi*0.012,grow=1+mi*0.02;
  for(let d=1;d<=end;d++){const early=d<=10;const n=early?2+Math.floor(rnd()*2):(rnd()<0.6?1:0);
   for(let k=0;k<n;k++){const c=cust[Math.floor(rnd()*cust.length)],r=rnd();const amt=Math.round(between(early?T.e1:T.l1,early?T.e2:T.l2)*drift/1000)*1000;
    if(r<0.45)add(d,`CEFT FROM ${c[0]} ${Math.floor(rnd()*90000+10000)}`,0,amt);
    else if(r<0.8){const no=chqIn++;add(d,`CHQ DEP ${no} ${c[0]}`,0,amt,String(no));}
    else add(d,'CASH DEP NEGOMBO ROUTE',0,Math.round(amt*0.45/1000)*1000);}
   if(d===5)add(d,'RENT - STORES PASYALA',350000,0);
   if(d===15)add(d,'CEB BILL PAYMENT ACC 4521',between(640000,760000),0);
   if(d%7===3)add(d,'FUEL - CEYPETCO FILLING STATION',between(150000,230000),0);
   if(d===12||d===26)add(d,'LORRY HIRE - SAMAN TRANSPORT',between(220000,300000),0);
   if(d===18)add(d,'POS 88213 M PERERA HARDWARE',between(60000,95000),0);
   if(d===20&&mi%2===0)add(d,'GENERATOR REPAIR - LANKA POWER',between(90000,160000),0);
   if(d===8&&mi%3===1)add(d,'ADVERT - LANKADEEPA',between(80000,120000),0);
   if(d===25){add(d,'SALARY TRANSFER '+MON[+mk.slice(5)-1].toUpperCase(),4200000+mi*30000,0);add(d,'EPF ETF PAYMENT',560000,0);}
   if(d>=24&&d<=29&&d%2===0)for(let k=0;k<2;k++){const s=sup[Math.floor(rnd()*sup.length)];const no=chqOut++;add(d,`CHQ ${no} ${s[0]}`,Math.round(between(T.s1,T.s2)*grow/1000)*1000,0,String(no));}
  }
  if(mi===3){const t=list.find(x=>x.chq&&x.cr&&+x.date.slice(8)<=6);if(t)add(+t.date.slice(8)+4,`CHQ RETURN ${t.chq} REFER TO DRAWER`,t.cr,0,t.chq);}
  if(!isCur){add(end,'SMS ALERT CHARGES',250,0);add(end,'SERVICE CHARGES',1500,0);}
  list.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const past=isCur?list.filter(t=>t.date<=asOf):list;if(isCur)future.push(...list.filter(t=>t.date>asOf));
  if(!past.length)return;
  const opening=bal;past.forEach(t=>{bal=round2(bal+t.cr-t.dr);t.bal=bal;});
  if(!isCur){const intr=Math.round(Math.max(0,-bal)*0.011);bal=round2(bal-intr);past.push({date:mk+'-'+pad(end),desc:'OD INTEREST',dr:intr,cr:0,chq:'',bal});}
  const stId='demo-st-'+mk,to=isCur?asOf:monthEnd(mk);
  stmts.push({id:stId,acc:acc.id,file:isCur?`${monthLabel(mk)} statement to ${dmy(to)} (demo).pdf`:`${monthLabel(mk)} statement (demo).pdf`,fileId:null,kind:'pdf',from:mk+'-01',to,opening,closing:bal,cr:round2(sum(past,t=>t.cr)),dr:round2(sum(past,t=>t.dr)),count:past.length,imported:past.length,dups:0,uploaded:now.toISOString(),recon:0,status:'Imported',map:null,hIdx:null});
  lists.push([stId,past]);
 });
 // Rest of this month (not yet in the bank) becomes commitments; supplier cheques already written = issued cheques.
 const party=t=>{const c=cust.find(([k])=>t.desc.includes(k))||sup.find(([k])=>t.desc.includes(k));return c?c[1]:t.desc.replace(/\s+\d+.*$/,'');};
 const plans=future.map((t,i)=>({id:'demo-f'+i,acc:acc.id,kind:t.cr?(t.chq?'CHQ_IN':'COLLECTION'):(/^CHQ \d/.test(t.desc)?'CHQ_OUT':'EXPENSE'),date:t.date,amount:t.cr||t.dr,party:party(t),flexible:false,chq:t.chq,note:'',status:'open',created:0}));
 // Next month: collections early, salary on the 25th, issued cheques, and flexible supplier payments.
 const L=monthEnd(curM),P=(o,kind,amount,party,flexible=false,chq='')=>({id:'demo-p'+o+kind+amount,acc:acc.id,kind,date:addDays(L,o),amount,party,flexible,chq,note:'',status:'open',created:0});
 plans.push({id:'demo-late',acc:acc.id,kind:'COLLECTION',date:addDays(asOf,-4),amount:450000,party:'Lanka Sathosa',flexible:false,chq:'',note:'Promised last week',status:'open',created:0},
  P(2,'COLLECTION',1200000,'Keells Super'),P(3,'COLLECTION',900000,'Cargills Food City'),P(4,'CHQ_IN',1500000,'Keells Super',false,'610001'),P(5,'COLLECTION',1100000,'Arpico Supercentre'),P(6,'COLLECTION',700000,'Laugfs Super'),P(7,'CHQ_IN',1200000,'Arpico Supercentre',false,'610002'),P(8,'COLLECTION',800000,'Lanka Sathosa'),P(9,'COLLECTION',600000,'Glomark'),
  P(10,'COLLECTION',1000000,'Keells Super'),P(11,'COLLECTION',800000,'Laugfs Super'),P(13,'COLLECTION',500000,'Keells Super'),P(14,'COLLECTION',900000,'Arpico Supercentre'),P(16,'COLLECTION',700000,'Lanka Sathosa'),P(18,'COLLECTION',600000,'Cargills Food City'),P(19,'COLLECTION',600000,'Glomark'),P(22,'COLLECTION',800000,'Keells Super'),
  P(5,'EXPENSE',350000,'Rent – stores'),P(15,'EXPENSE',720000,'CEB'),P(25,'EXPENSE',4300000,'Salaries'),P(25,'EXPENSE',560000,'EPF / ETF'),
  P(20,'CHQ_OUT',1800000,'Prima Ceylon',false,'345920'),P(27,'CHQ_OUT',1600000,'CIC Holdings',false,'345921'),
  P(24,'SUPPLIER',2200000,'Serendib Flour Mills',true),P(26,'SUPPLIER',1500000,'DPL Packaging',true),P(28,'SUPPLIER',2600000,'Prima Ceylon',true),P(29,'SUPPLIER',1200000,'Serendib Flour Mills',true),
  P(33,'COLLECTION',1300000,'Keells Super'),P(34,'CHQ_IN',1400000,'Arpico Supercentre',false,'610003'),P(35,'COLLECTION',1000000,'Cargills Food City'),P(36,'COLLECTION',900000,'Laugfs Super'));
 return{acc,rules,stmts,lists,plans};
}
ACT.demo=async()=>{
 if(S.accounts.some(a=>a.id==='demo-acc'))return toast('Demo data is already loaded.');
 if(S.txns.length&&!confirm('Demo data will be added as a separate DEMO account next to your data. Continue?'))return;
 const D=buildDemo(new Date());
 await DB.putMany('rules',D.rules);S.rules.push(...D.rules);
 const txns=[];D.lists.forEach(([stId,list])=>list.forEach((t,i)=>{const c=classify(t);txns.push({id:stId+'-'+i,acc:D.acc.id,stmt:stId,date:t.date,desc:t.desc,dr:t.dr,cr:t.cr,bal:t.bal,chq:t.chq,ref:'',seq:i,cat:c.cat,party:c.party,src:c.src,key:txKey(D.acc.id,t)});}));
 await DB.put('accounts',D.acc);await DB.putMany('statements',D.stmts);await DB.putMany('txns',txns);await DB.putMany('plans',D.plans);
 S.accounts.push(D.acc);S.statements.push(...D.stmts);S.txns.push(...txns);S.plans.push(...D.plans);derive();
 toast('Demo loaded: 6 months of statements, this month to date, and upcoming commitments.',4500);location.hash='#dash';render();
};

/* ---- Events & start ---- */
CHG.accSel=el=>{S.ui.acc=el.value;render();};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();Promise.resolve(ACT[b.dataset.act]?.(b)).catch(err=>{console.error(err);toast(err.message||String(err),6000);});});
document.addEventListener('change',e=>{if(e.target.id==='pk'){const f=$('#pf');if(f)f.checked=PLAN_KINDS[e.target.value].flex;}
 const b=e.target.closest('[data-chg]');if(!b)return;Promise.resolve(CHG[b.dataset.chg]?.(b,e)).catch(err=>{console.error(err);toast(err.message||String(err),6000);});});
window.addEventListener('hashchange',route);
(async()=>{
 try{await IDB.open();}catch(e){console.warn('IndexedDB unavailable, using memory',e);DB=MemDB;MEMORY_ONLY=true;}
 if(window.Chart){const c=getComputedStyle(document.documentElement);Chart.defaults.color=c.getPropertyValue('--mut').trim()||'#667085';Chart.defaults.borderColor=c.getPropertyValue('--line').trim()||'#e4e8ee';Chart.defaults.font.family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif';}
 await loadAll();route();
})();
</script>
